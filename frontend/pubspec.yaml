name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  file_picker: ^8.1.2
  video_player: ^2.9.2
  video_player_web: ^2.4.0
  video_player_platform_interface: ^6.9.0
  flutter_secure_storage: ^10.3.4
  speech_to_text: ^7.5.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  image_picker: ^1.2.4
  socket_io_client: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  # Noto Sans JP (SIL OFL 1.1) đã cắt gọn còn ~8.000 ký tự thông dụng
  # (kana, JIS X 0208, Latin/tiếng Việt). Đóng gói sẵn để chữ Hán không bị
  # hiện ô vuông trong lúc Flutter web chờ tải font dự phòng từ mạng.
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700