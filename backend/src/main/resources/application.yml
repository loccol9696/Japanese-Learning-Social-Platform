# Mọi giá trị bí mật (mật khẩu DB, mail, Cloudinary, JWT, Redis) đọc từ biến môi
# trường. Khi chạy local, khai báo chúng trong backend/.env (đã gitignore) —
# xem backend/.env.example để biết danh sách biến cần có.
spring:
  # Nạp backend/.env (chạy từ thư mục backend hoặc từ thư mục gốc repo).
  # Biến môi trường thật của hệ điều hành luôn được ưu tiên hơn file này.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Quan hệ LAZY được nạp theo lô (WHERE id IN ...) thay vì mỗi dòng một truy vấn.
        default_batch_fetch_size: 50
    # In từng câu SQL ra console làm chậm mọi request; bật khi cần debug: JPA_SHOW_SQL=true
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 5s

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD} # App Password 16 ký tự từ Google
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
ai:
  vocal-service:
    # Điền link từ Cloudflare / Ngrok của máy bạn
    url: untraitorous-huong-conversably.ngrok-free.dev/api/v1/separate-vocal
    enabled: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Thanh toán mua gói bằng chuyển khoản VietQR. Thiếu thông tin tài khoản nhận thì không tạo được đơn.
payment:
  enabled: ${PAYMENT_ENABLED:true}
  bank-bin: ${PAYMENT_BANK_BIN:}
  bank-name: ${PAYMENT_BANK_NAME:}
  account-no: ${PAYMENT_ACCOUNT_NO:}
  account-name: ${PAYMENT_ACCOUNT_NAME:}
  order-ttl-minutes: ${PAYMENT_ORDER_TTL_MINUTES:15}
  late-grace-hours: ${PAYMENT_LATE_GRACE_HOURS:24}
  max-orders-per-hour: ${PAYMENT_MAX_ORDERS_PER_HOUR:10}

sepay:
  # Khoá bí mật SePay gửi kèm webhook (header Authorization: Apikey <khoá>). Để trống thì webhook từ chối mọi yêu cầu.
  webhook-key: ${SEPAY_WEBHOOK_KEY:}

server:
  port: 8080
  # Nén gzip JSON (feed kèm phụ đề khá nặng); app Flutter / trình duyệt tự giải nén.
  compression:
    enabled: true
    min-response-size: 2KB
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-response: true

app:
  security:
    enabled: true

# Server Socket.IO cho chat realtime (port riêng, không đi qua Spring MVC)
socketio:
  enabled: ${SOCKETIO_ENABLED:true}
  host: ${SOCKETIO_HOST:0.0.0.0}
  port: ${SOCKETIO_PORT:9092}
  # Số luồng xử lý event; mỗi user luôn vào cùng một luồng để giữ thứ tự tin nhắn
  worker-threads: ${SOCKETIO_WORKER_THREADS:4}

# Thông báo đẩy chat qua Firebase Cloud Messaging. Để trống thì tự tắt.
fcm:
  project-id: ${FCM_PROJECT_ID:}
  credentials-path: ${FCM_CREDENTIALS_PATH:}

jwt:
  # Bắt buộc khai báo, tối thiểu 32 byte (256 bit). Server sẽ không khởi động nếu thiếu.
  secret: ${JWT_SECRET}
  issuer: jlsp-backend
  access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
  refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}
---
# Cấu hình riêng khi chạy Profile: dev
spring:
  config:
    activate:
      on-profile: dev

gcp:
  stt:
    enabled: false

# Dev chạy cùng luật phân quyền với prod để lỗi phân quyền lộ ra sớm.
app:
  security:
    enabled: true

# Dev dùng phân tích ngữ pháp giả lập (không gọi Gemini, không tốn quota).
ai-analysis:
  mock:
    delay-ms: 15000
    enabled: true
  api-key: "fake-key"
  base-url: "https://fake-api.com"

---
# Cấu hình riêng cho môi trường Production
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

app:
  security:
    enabled: true # Bắt buộc bật toàn bộ filter bảo mật và kiểm tra JWT

gcp:
  stt:
    enabled: true
  project-id: ${GCP_PROJECT_ID:swp391-478004}
  speech:
    credentials-path: ${GCP_CREDENTIALS_PATH:classpath:credentials/credentials.json}
  storage:
    bucket-name: ${GCP_BUCKET_NAME:sptote_bucket_1}

ai-analysis:
  mock:
    enabled: false
  api-key: ${GEMINI_API_KEY}
  base-url: "https://generativelanguage.googleapis.com/v1beta"
  model: ${GEMINI_MODEL}
